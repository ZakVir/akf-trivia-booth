<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>window.coi = { coepCredentialless: () => false, quiet: true };   /* static hosting (GitHub Pages) has no COOP/COEP headers: this service worker adds them, so multi-threaded detection works. The local server sends them itself (then this does nothing). */</script>
<script src="coi-serviceworker.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AKF Trivia - TV</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="audience.css">
</head>
<body>
<div id="stage">

  <!-- Left: question + answers (design: "Questions" / "Images / extra Question space") -->
  <section id="leftP" class="panel"></section>
  <div id="qbox">
    <div id="qtop"><span id="qnum"></span><span id="level"></span></div>
    <div id="qtext"></div>
    <div id="timer"><div id="timerFill"></div></div>
  </div>
  <div id="xbox"><div id="body"></div></div>

  <!-- Right top: live feed -->
  <section id="liveP" class="panel"></section>
  <div id="liveLbl">Live Feed</div>
  <section id="cam">
    <div id="camCard"><div class="sub">Step in front of the camera<br>and join the game!</div></div>
    <div id="simBack"></div>
    <video id="video" muted playsinline autoplay></video>
    <img id="pvimg" alt="">
    <canvas id="kites" width="1148" height="617"></canvas>
    <canvas id="replay" width="1148" height="646"></canvas>
    <div id="buzzHint">🙋 Raise your hand to answer!</div>
    <div id="buzzBanner"></div>
  </section>

  <!-- the little screen-buddy tab between the panels -->
  <div id="mascot3d" aria-hidden="true"></div>   <!-- 3D mascot (mascot3d.mjs); the flat face below stays if 3D cannot run -->
  <div id="mascotTab" aria-hidden="true">
    <svg viewBox="0 0 149 146" width="149" height="146">
      <path d="M0 0H149V111Q149 135 125 135H86V146H58V135H24Q0 135 0 111Z" fill="#E2E5ED"/>
      <g class="eyes" fill="#0C234B"><rect x="50" y="35" width="13" height="38" rx="6.5"/><rect x="85" y="35" width="13" height="38" rx="6.5"/></g>
      <path d="M50 80H93Q93 102 71.5 102Q50 102 50 80Z" fill="#000"/>
    </svg>
  </div>

  <!-- Right bottom: scores -->
  <section id="scoreP" class="panel"></section>
  <div id="podTab"><canvas id="podium" width="458" height="448" role="img" aria-label="Leaderboard: no points yet"></canvas></div>   <!-- live top-3 podium: leaderboard.js -->
  <div id="howto">
    <div class="lbl">How to play</div>
    <div class="steps">
      <div class="st"><i style="background:#E3EDFF">🧍</i><span>Step into<br>the square</span></div>
      <div class="st"><i style="background:#FFFFE3">🙋</i><span>Raise your hand<br>to answer</span></div>
      <div class="st"><i style="background:#E2FFD4">⭐</i><span>Score points<br>for your team</span></div>
    </div>
    <div id="didyou"><b>Did you know?</b> <span id="didyouTxt"></span></div>
  </div>
  <div id="cards"></div>

  <canvas id="confetti" width="1920" height="1080"></canvas>
  <div id="wait">Waiting for the host window...</div>
</div>

<script src="questions.js"></script>
<script src="shared.js"></script>
<script src="tracker.js"></script>
<script src="kites.js"></script>
<script src="leaderboard.js"></script>
<script src="mascot-director.js"></script>
<script src="buzz.js"></script>
<script src="pose-logic.js"></script>
<script src="yolo-pose.js"></script>
<script src="reid.js"></script>
<script src="cam.js"></script>
<script src="audience.js"></script>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }</script>
<script type="module" src="mascot3d.mjs"></script>
<script type="module" src="logo-sprites.mjs"></script>
</body>
</html>
